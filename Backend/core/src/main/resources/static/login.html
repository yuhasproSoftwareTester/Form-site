<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74A662 0%, #9CB349 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 45px;
            max-width: 460px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 18px;
        }

        .field-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            font-size: 14px;
        }

        label .required {
            color: #e74c3c;
            margin-left: 2px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s ease;
            background: #fafafa;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #74A662;
            background: #fff;
        }

        input.error {
            border-color: #e74c3c;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-msg.visible {
            display: block;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #74A662 0%, #9CB349 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            margin-top: 6px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .success-msg {
            display: none;
            text-align: center;
            padding: 16px;
            background: #d4edda;
            color: #155724;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 18px;
            border: 1px solid #c3e6cb;
        }

        .success-msg.visible {
            display: block;
        }

        .error-banner {
            display: none;
            text-align: center;
            padding: 14px;
            background: #f8d7da;
            color: #721c24;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 18px;
            border: 1px solid #f5c6cb;
        }

        .error-banner.visible {
            display: block;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .register-link a:hover {
            color: #9CB349;
            text-decoration: underline;
        }

        .toggle-pwd {
            position: relative;
        }

        .toggle-pwd input {
            padding-right: 50px;
        }

        .toggle-pwd .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .toggle-pwd .toggle-btn:hover {
            background: #f0f0f0;
            color: #444;
        }

        @media (max-width: 500px) {
            .container {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1> Student Login</h1>
    <p class="subtitle">Sign in with your registered email and password</p>

    <form id="loginForm" novalidate>

        <!-- Email -->
        <div class="field-group">
            <label for="loginEmail">Email <span class="required">*</span></label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
            <div class="error-msg" id="emailError">Please enter a valid email address.</div>
        </div>

        <!-- Password with show/hide toggle -->
        <div class="field-group">
            <label for="loginPassword">Password <span class="required">*</span></label>
            <div class="toggle-pwd">
                <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
                <button type="button" class="toggle-btn" id="togglePwdBtn">Show</button>
            </div>
            <div class="error-msg" id="passwordError">Password is required (min. 6 characters).</div>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn"> LOGIN</button>

        <!-- Success & Error Messages -->
        <div class="success-msg" id="successMsg"> Login successful! Welcome back.</div>
        <div class="error-banner" id="errorBanner"> Invalid email or password. Please try again.</div>

        <!-- Register link -->
        <div class="register-link">
            Don't have an account? <a href="http://localhost:8080/registration.html">Register here</a>
        </div>
    </form>
</div>

<script>
    const form = document.getElementById('loginForm');
    const toggleBtn = document.getElementById('togglePwdBtn');
    const passwordField = document.getElementById('loginPassword');

    // --- Toggle password visibility ---
    toggleBtn.addEventListener('click', function () {
        const isPassword = passwordField.type === 'password';
        passwordField.type = isPassword ? 'text' : 'password';
        toggleBtn.textContent = isPassword ? 'Hide' : 'Show';
    });

    // --- Helper: show/hide error on a field ---
    function setError(fieldId, errorId, condition) {
        const field = document.getElementById(fieldId);
        const errorEl = document.getElementById(errorId);
        if (condition) {
            field.classList.add('error');
            errorEl.classList.add('visible');
        } else {
            field.classList.remove('error');
            errorEl.classList.remove('visible');
        }
    }

    // --- Clear errors on input ---
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', function () {
            this.classList.remove('error');
            const parent = this.closest('.field-group');
            if (parent) {
                const errMsg = parent.querySelector('.error-msg');
                if (errMsg) errMsg.classList.remove('visible');
            }
            // Also hide the general error banner when user starts typing
            document.getElementById('errorBanner').classList.remove('visible');
        });
    });

    // --- Form submit ---
    form.addEventListener('submit', function (e) {
        e.preventDefault();

        // Hide previous banners
        document.getElementById('successMsg').classList.remove('visible');
        document.getElementById('errorBanner').classList.remove('visible');

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const isEmailValid = emailRegex.test(email);
        const isPasswordValid = password.length >= 6;

        // Set field-level errors
        setError('loginEmail', 'emailError', !isEmailValid);
        setError('loginPassword', 'passwordError', !isPasswordValid);

        // Check overall validity
        const errorFields = document.querySelectorAll('.error');
        if (errorFields.length > 0) {
            return;
        }

        fetch("/api/users/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })
        })
        .then(response => {

            if (!response.ok) {
                throw new Error("Invalid email or password");
            }

            return response.json();
        })
        .then(data => {

            console.log("Login successful:", data);

            document
                .getElementById('successMsg')
                .classList.add('visible');

        })
        .catch(error => {

            console.error("Login failed:", error);

            document
                .getElementById('errorBanner')
                .classList.add('visible');

        });
    });

    // --- Allow pressing Enter to submit (already default) ---
</script>

</body>
</html>
